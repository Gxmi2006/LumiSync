# Installs LumiSync from scratch the way a user who downloads the ZIP does,
# then runs the tests and a short end-to-end run, on Windows and Linux.
# When a step fails, the end of its output is published as an error
# annotation, so the cause is visible on the run page.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    defaults:
      run:
        shell: bash
    env:
      # Linux has no monitor on GitHub, so run desktop steps in a virtual X11 display.
      DESKTOP: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1

      - name: Install LumiSync like a user would
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Setup check
        run: bash .github/run_step.sh "Setup check" $DESKTOP python -m lumisync --setup-check

      - name: Tests
        run: bash .github/run_step.sh "Tests" $DESKTOP python -m pytest -q -rf --tb=short -p no:cacheprovider

      - name: Smoke run
        run: bash .github/run_step.sh "Smoke run" $DESKTOP python tests/smoke_run.py
