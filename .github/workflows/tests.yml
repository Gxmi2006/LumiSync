# Installs LumiSync from scratch the way a user who downloads the ZIP does,
# then runs the tests and a short end-to-end run, on Windows and Linux.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1

      - name: Install LumiSync like a user would
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Setup check
        if: runner.os == 'Windows'
        run: python -m lumisync --setup-check

      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -q

      - name: Smoke run (Windows)
        if: runner.os == 'Windows'
        run: python tests/smoke_run.py

      - name: Setup check (Linux, virtual X11 display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m lumisync --setup-check

      - name: Tests (Linux, virtual X11 display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q

      - name: Smoke run (Linux, virtual X11 display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/smoke_run.py
