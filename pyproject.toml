[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumisync"
version = "0.2.0"
description = "Lightweight open-source ambient RGB synchronization engine for Windows."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "LumiSync Contributors" }]
license = { text = "MIT" }
dependencies = [
  "comtypes>=1.4.8",
  "keyboard>=0.13.5",
  "mss>=9.0.1",
  "numpy>=1.26.0",
  "opencv-python>=4.9.0.80",
  "openrgb-python>=0.3.6",
  "pillow>=10.2.0",
  "psutil>=5.9.8",
  "pycaw>=20240210",
  "pystray>=0.19.5",
  "pywin32>=306",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
lumisync = "lumisync.__main__:main"
konsl-aura-sync = "lumisync.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lumisync*", "konsl_aura_sync*"]
